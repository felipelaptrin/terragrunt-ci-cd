[tools]
terraform = "1.15.4"
terragrunt = "1.0.6"
pre-commit = "4.6.0"
tflint = "0.62.1"
trivy = "0.70.0"
jq = "1.8.1"

[tasks.floci-up]
description = "Start Floci (local AWS emulator) and bootstrap state bucket"
run = """
echo '[INFO] Initializing Floci using Docker Compose'
docker compose up -d
sleep 5
AWS_ENDPOINT_URL=http://localhost:4566 \
  aws s3api create-bucket \
    --bucket terragrunt-states-local \
    --region us-east-1
"""

[tasks.floci-down]
description = "Stop Floci"
run = "docker compose down"

[tasks.plan-local]
description = "Run terragrunt plan on all stacks in local environment"
dir = "live/local/us-east-1"
run = """
AWS_ENDPOINT_URL=http://localhost:4566 \
AWS_ACCESS_KEY_ID=test \
AWS_SECRET_ACCESS_KEY=test \
AWS_DEFAULT_REGION=us-east-1 \
  terragrunt run --all plan --non-interactive --backend-bootstrap
"""

[tasks.apply-local]
description = "Run terragrunt apply on all stacks in local environment"
dir = "live/local/us-east-1"
run = """
AWS_ENDPOINT_URL=http://localhost:4566 \
AWS_ACCESS_KEY_ID=test \
AWS_SECRET_ACCESS_KEY=test \
AWS_DEFAULT_REGION=us-east-1 \
  terragrunt run --all apply --non-interactive --backend-bootstrap
"""

[tasks.pre-commit-install]
description = "Install pre-commit git hooks"
run = "pre-commit install"

[tasks.pre-commit]
description = "Run all pre-commit hooks against all files"
run = "pre-commit run --all-files"
