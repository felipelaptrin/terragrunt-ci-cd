name: Terragrunt

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

env:
  DEV_TERRAFORM_ROLE: arn:aws:iam::937168356724:role/GitHubActions
  PROD_TERRAFORM_ROLE: arn:aws:iam::730335516527:role/GitHubActions

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools via mise
        uses: jdx/mise-action@v4

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # ===== DEV =====

  plan-dev-us-east-1:
    name: "[DEV - us-east-1] Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terragrunt Plan
        uses: ./.github/actions/terragrunt
        with:
          action: plan
          environment: DEV
          aws_region: us-east-1
          working_dir: live/dev/us-east-1
          aws_role_arn: ${{ env.DEV_TERRAFORM_ROLE }}
          github_token: ${{ github.token }}

  apply-dev-us-east-1:
    name: "[DEV - us-east-1] Apply"
    needs: [plan-dev-us-east-1]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terragrunt Apply
        uses: ./.github/actions/terragrunt
        with:
          action: apply
          environment: DEV
          aws_region: us-east-1
          working_dir: live/dev/us-east-1
          aws_role_arn: ${{ env.DEV_TERRAFORM_ROLE }}

  # ===== PROD =====

  plan-prod-us-east-1:
    name: "[PROD - us-east-1] Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terragrunt Plan
        uses: ./.github/actions/terragrunt
        with:
          action: plan
          environment: PROD
          aws_region: us-east-1
          working_dir: live/prod/us-east-1
          aws_role_arn: ${{ env.PROD_TERRAFORM_ROLE }}
          github_token: ${{ github.token }}

  apply-prod-us-east-1:
    name: "[PROD - us-east-1] Apply"
    needs: [apply-dev-us-east-1, plan-prod-us-east-1]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terragrunt Apply
        uses: ./.github/actions/terragrunt
        with:
          action: apply
          environment: PROD
          aws_region: us-east-1
          working_dir: live/prod/us-east-1
          aws_role_arn: ${{ env.PROD_TERRAFORM_ROLE }}
