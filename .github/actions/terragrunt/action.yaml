name: Terragrunt
description: Run Terragrunt plan or apply on all stacks under an env/region directory

inputs:
  action:
    description: "Action to perform: plan or apply"
    required: true
  environment:
    description: "Environment label used in PR comments (e.g. DEV, PROD)"
    required: true
  aws_region:
    description: "AWS region"
    required: true
  working_dir:
    description: "Env/region directory (e.g. live/dev/us-east-1). All stacks underneath are discovered automatically."
    required: true
  aws_role_arn:
    description: "AWS IAM Role ARN to assume via OIDC"
    required: true
  github_token:
    description: "GitHub token for posting PR plan comments"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install tools via mise
      uses: jdx/mise-action@v4

    - name: Set up Terraform plugin cache
      shell: bash
      run: |
        echo "Setting up Terraform plugin cache at ~/.terraform.d/plugin-cache"
        mkdir -p ~/.terraform.d/plugin-cache
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV
        echo "TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE=true" >> $GITHUB_ENV

    - name: Cache Terraform providers
      uses: actions/cache@v5
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-plugins-${{ hashFiles('**/*.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-plugins-

    - name: Cache Terragrunt modules
      uses: actions/cache@v5
      with:
        path: ~/.terragrunt-cache
        key: ${{ runner.os }}-terragrunt-${{ hashFiles('**/*.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terragrunt-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        role-session-name: GitHub-Actions-${{ inputs.environment }}
        aws-region: ${{ inputs.aws_region }}

    - name: Terragrunt init
      if: inputs.action == 'plan'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      run: |
        echo "Initializing all units under ${{ inputs.working_dir }}"
        terragrunt run --all init

    - name: Terragrunt plan
      id: plan
      if: inputs.action == 'plan'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      run: |
        echo "Running terragrunt plan across all units in ${{ inputs.working_dir }}"
        set +e
        OUTPUT=$(terragrunt run --all plan --non-interactive -- -out=tfplan 2>&1)
        EXIT_CODE=$?
        echo "$OUTPUT"
        DELIMITER=$(openssl rand -hex 16)
        echo "output<<${DELIMITER}" >> $GITHUB_OUTPUT
        echo "${OUTPUT}" >> $GITHUB_OUTPUT
        echo "${DELIMITER}" >> $GITHUB_OUTPUT
        exit $EXIT_CODE

    - name: Convert plans to JSON for Trivy
      if: inputs.action == 'plan'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      run: |
        echo "Converting binary tfplan files to JSON for Trivy scanning"
        find . -name "tfplan" -path "*/.terragrunt-cache/*" | while read plan_file; do
          dir=$(dirname "$plan_file")
          echo "Converting: $plan_file"
          terraform -chdir="$dir" show -json tfplan > "${plan_file}.json"
        done

    - name: Comment plan on PR
      if: inputs.action == 'plan' && github.event_name == 'pull_request' && inputs.github_token != ''
      uses: borchero/terraform-plan-comment@v3
      env:
        TG_LOG_CUSTOM_FORMAT: "%msg(path=relative)"
      with:
        token: ${{ inputs.github_token }}
        planfile: tfplan
        terraform-cmd: "terragrunt run --all"
        working-directory: ${{ inputs.working_dir }}
        header: "Terragrunt Plan — ${{ inputs.environment }} (${{ inputs.aws_region }})"

    - name: Trivy security scan
      if: inputs.action == 'plan'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      run: |
        echo "Scanning plan files for HIGH/CRITICAL misconfigurations"
        TRIVY_EXIT=0
        while IFS= read -r plan_json; do
          echo "Scanning: $plan_json"
          trivy config "$plan_json" \
            --severity HIGH,CRITICAL \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore.yaml" \
            --exit-code 1 || TRIVY_EXIT=1
        done < <(find . -name "tfplan.json" -path "*/.terragrunt-cache/*")
        exit $TRIVY_EXIT

    - name: Terragrunt apply
      if: inputs.action == 'apply'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      run: |
        echo "Applying changes across all units in ${{ inputs.working_dir }}"
        terragrunt run --all apply --non-interactive
